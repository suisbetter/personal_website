<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <style>
        .card-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap; 
        }

        .card {
          display: flex;
          justify-content: center;
          align-items: center;
          border: 1px solid rgba(255, 255, 255, 0.2); 
          border-radius: 8px;
          box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); 
          box-sizing: border-box;
          margin: 1em;
          padding: 1em;
          width: 300px;
          height: 200px;
          background: rgba(55, 76, 146, 0.35); 
          backdrop-filter: blur(12px); 
          -webkit-backdrop-filter: blur(12px);                                                                                   
          font-family: manrope, sans-serif;
          transition: transform 0.2s ease, background 0.2s ease;
}

        .title-card {
            flex: 0 0 100%;
            width: auto;
            max-width: 900px;
            justify-content: center;
            align-items: center;
            height: auto;
        }

        .card-content {
            text-align: center;
        }

        body {
            background-image: url('space_bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
        }

        h1 {
            text-align: center;
            font-size: 4em;
            font-family: manrope, sans-serif;
        }

        p {
            margin: 0;
            font-size: 0.95em;
            line-height: 1.4;
        }

        .top {
            font-size: 2em;
            font-weight: bold;
        }

        .project-card {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            background-size: cover;
            background-position: center;
            text-decoration: none;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .project-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            transition: background 0.2s ease;
        }

        .project-card:hover::before {
            background: rgba(0, 0, 0, 0.25);
        }

        .project-card .card-content {
            position: relative;
            z-index: 1;
        }

        .project-card h3 {
            font-family: manrope, sans-serif;
            font-size: 1em;
        }

        .card-link {
            text-decoration: none;
            color: inherit;
            display: inline-block;
        }
    </style>
    <h1 class="top">Current Projects</h1>
    <div class="card-container">
        <div class="card title-card">
            <div class="card-content">
                <p>Here are the projects I'm currently working on, pulled live from my Scratch profile.</p>
            </div>
        </div>
        <div id="projects"></div>
    </div>
    <p id="status" style="text-align:center; font-family: manrope, sans-serif;"></p>
    <a href="index.html" style="
        position: fixed;
        top: 20px;
        left: 20px;
        font-size: 2em;
        font-family: manrope, sans-serif;
        color: white;
        text-decoration: none;
        background: rgba(55, 76, 146, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        padding: 10px 20px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: background 0.2s ease, transform 0.2s ease;
        z-index: 1000;
    " onmouseover="this.style.background='rgba(55, 76, 146, 0.55)'; this.style.transform='translateY(-3px)'" onmouseout="this.style.background='rgba(55, 76, 146, 0.35)'; this.style.transform='none'">&#8592; Home</a>
    <script>
        const projectsContainer = document.getElementById('projects');
        const status = document.getElementById('status');
        status.textContent = 'Loading projects...';

        fetch('https://api.scratch.mit.edu/users/udinshmafi/projects')
            .then(response => response.json())
            .then(projects => {
                status.textContent = '';
                if (!projects.length) {
                    status.textContent = 'No projects found yet.';
                    return;
                }
                projects.forEach(project => {
                    const cardLink = document.createElement('a');
                    cardLink.className = 'card-link';
                    cardLink.href = 'https://scratch.mit.edu/projects/' + project.id + '/';
                    cardLink.target = '_blank';
                    cardLink.innerHTML = `
                        <div class="card project-card" style="background-image: url('${project.image}');">
                            <div class="card-content">
                                <h3>${project.title}</h3>
                            </div>
                        </div>`;
                    projectsContainer.appendChild(cardLink);
                });
            })
            .catch(() => {
                status.textContent = "Couldn't load projects. Check your connection and try again.";
            });
    </script>
</body>
</html>
